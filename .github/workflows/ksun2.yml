name: Build GKI 6.1 (KSU + SuSFS) - Full Fix

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Nama Kernel (Opsional)'
        required: false
        default: ''
      clang_version:
        description: 'Versi Clang'
        required: true
        default: 'r536225 (Clang 19)'
        type: choice
        options:
        - 'r536225 (Clang 19)'
        - 'r547379 (Clang 20)'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential bc bison flex libssl-dev git curl \
          python3 python3-pip lld zip unzip libncurses5-dev rsync \
          cpio schedtool git-core gnupg libelf-dev dwarves

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git config --global url."https://".insteadOf git://

      - name: Initialize & Sync Source (GKI 6.1)
        run: |
          mkdir gki
          cd gki
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android14-6.1
          repo sync -j$(nproc) --force-sync

      - name: Setup Custom Clang
        working-directory: gki
        run: |
          mkdir -p toolchain/clang
          
          if [ "${{ github.event.inputs.clang_version }}" == "r536225 (Clang 19)" ]; then
            echo "Setting up Clang-19 (r536225)..."
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-2025/clang-r536225.tar.gz"
          else
            echo "Setting up Clang-20 (r547379)..."
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/62cdcefa89e31af2d72c366e8b5ef8db84caea62/clang-r547379.tar.gz"
          fi
          
          echo "Downloading Clang..."
          curl -L "${CLANG_URL}" | tar -xz -C toolchain/clang

      - name: Patch KernelSU (Official)
        working-directory: gki/common
        run: |
          echo "Setting up KernelSU-Next..."
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs

      - name: Patch SuSFS (KSUNIV Style)
        working-directory: gki/common
        run: |
          echo "> Cloning susfs4ksu (Branch: gki-android14-6.1)"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 sus
          
          echo "> Patching susfs4ksu"
          # Mengadopsi logic copy dari KSNUNIV.yml
          cp -r sus/kernel_patches/fs/* fs/
          cp -r sus/kernel_patches/include/* include/
          cp sus/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch .
          
          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch
          
          echo "> SUSFS patched successfully"
          rm -rf sus 50_add_susfs_in_gki-android14-6.1.patch

      - name: Configure Kernel
        working-directory: gki/common
        run: |
          export PATH="$(pwd)/../toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          
          echo "Generating GKI defconfig..."
          make O=out gki_defconfig

          echo "> Injecting Configs..."
          
          # --- Logic Config  ---
          cat <<EOF >> out/.config
          
          # ===============================================
          # Konfigurasi KSU NEXT (Base)
          CONFIG_KSU=y
          CONFIG_KPM=n
          CONFIG_KSU_SUSFS_SUS_SU=n
          CONFIG_KSU_SYSCALL_HOOK=n
          
          # --- SUSFS Method (with built-in inline hook) ---
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT_SPOOF_GENERIC=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          
          # Disable other hooks
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_KSU_MANUAL_HOOK=n
          CONFIG_KSU_HAS_MANUAL_HOOK=n
          
          # --- Performance & Network Tuning ---
          # Add additional tmpfs config setting
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          # Add additional config setting
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          # Add BBR Config
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=n
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_DEFAULT_BBR=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
          CONFIG_SCHED_TUNE=y
          CONFIG_MQ_IOSCHED_KYBER=y
          CONFIG_MQ_IOSCHED_BFQ=y
          CONFIG_IOSCHED_BFQ=y
          CONFIG_BFQ_GROUP_IOSCHED=y
          CONFIG_ZRAM=y
          CONFIG_ZRAM_WRITEBACK=y
          EOF

          # --- Logic Nama Kernel ---
          if [ ! -z "${{ github.event.inputs.kernel_name }}" ]; then
            scripts/config --file out/.config --set-str LOCALVERSION "-${{ github.event.inputs.kernel_name }}"
          else
            scripts/config --file out/.config --set-str LOCALVERSION ""
          fi

          # --- LTO Config ---
          scripts/config --file out/.config \
              -e LTO_CLANG \
              -d LTO_NONE \
              -e LTO_CLANG_THIN \
              -d LTO_CLANG_FULL \
              -e THINLTO

      - name: Build Kernel Image
        working-directory: gki/common
        run: |
          export PATH="$(pwd)/../toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          
          echo "Starting Build..."
          make -j"$(nproc --all)" O=out Image

      - name: Determine Artifact Name
        id: artifact-name
        run: |
          if [ -z "${{ github.event.inputs.kernel_name }}" ]; then
            echo "NAME=GKI-Image-Android14" >> $GITHUB_ENV
          else
            echo "NAME=${{ github.event.inputs.kernel_name }}-Image" >> $GITHUB_ENV
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: gki/common/out/arch/arm64/boot/Image
          compression-level: 9
