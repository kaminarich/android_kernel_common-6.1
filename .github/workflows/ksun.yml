name: Build Aetherium3.3-KSN (GKI 6.1)

on:
  workflow_dispatch:

jobs:
  build:
    # Tetap gunakan Ubuntu 24.04 untuk kompatibilitas tools build terbaru
    runs-on: ubuntu-24.04

    env:
      DEBIAN_FRONTEND: noninteractive
      KERNEL_NAME: "Aetherium3.3-Eclipse-KSN"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          echo "Updating package lists..."
          sudo apt-get update
          # Dependensi lengkap (termasuk libelf-dev & dwarves untuk fix error sebelumnya)
          sudo apt-get install -y build-essential bc bison flex libssl-dev git curl \
          python3 python3-pip lld zip unzip libncurses5-dev libelf-dev dwarves

      - name: Setup Toolchain (Clang 19)
        run: |
          mkdir -p toolchain/clang
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-2025/clang-r536225.tar.gz"
          
          echo "Downloading Clang..."
          curl -L "${CLANG_URL}" | tar -xz -C toolchain/clang

      - name: Install KernelSU-Next (Via Installer Script)
        run: |
          # 1. Bersihkan folder KernelSU lama (SukiSU) agar instalasi bersih
          echo "Cleaning up existing KernelSU directory..."
          rm -rf drivers/kernelsu
          
          # 2. Jalankan Script Installer Resmi (Metode User)
          # Script ini otomatis handle clone branch 'dev' dan patching yang diperlukan
          echo "Running KernelSU-Next setup script..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s dev

      - name: Configure Kernel Build Options
        run: |
          export PATH="$(pwd)/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          
          echo "Generating GKI defconfig..."
          make O=out gki_defconfig

          # --- Custom Configs ---
          
          # 1. Identitas Kernel
          scripts/config --file out/.config --set-str LOCALVERSION "-${KERNEL_NAME}"
          
          # 2. Optimasi Link Time (LTO)
          scripts/config --file out/.config -e LTO_CLANG -d LTO_NONE -e LTO_CLANG_THIN -d LTO_CLANG_FULL -e THINLTO

          # 3. Integrasi KernelSU
          # Pastikan config KSU aktif (script installer biasanya sudah menambahkan ini, tapi kita force enable biar aman)
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e OVERLAY_FS

          # 4. FIX Build Error (BTF/Pahole)
          # Wajib dimatikan di GKI 6.1 Custom Build agar tidak error di tengah jalan
          scripts/config --file out/.config -d DEBUG_INFO_BTF
          scripts/config --file out/.config -d DEBUG_INFO_BTF_MODULES

      - name: Compile Kernel Image
        run: |
          export PATH="$(pwd)/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          
          echo "Starting Build..."
          make -j"$(nproc --all)" O=out Image

      - name: Verify Compile Output
        run: |
          if [ -f out/arch/arm64/boot/Image ]; then
              echo "Build SUCCESS! Checking version..."
              strings out/arch/arm64/boot/Image | grep "Linux version" | head -n 1
          else
              echo "Build FAILED: Image not found." && exit 1
          fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-Image
          path: out/arch/arm64/boot/Image
          compression-level: 9
