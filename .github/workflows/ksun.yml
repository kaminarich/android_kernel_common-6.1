name: Build Aetherium3.3-KSN (GKI 6.1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # container: image: ubuntu:22.04  <-- DIHAPUS AGAR GIT & SUBMODULE BERJALAN LANCAR

    env:
      DEBIAN_FRONTEND: noninteractive
      KERNEL_NAME: "Aetherium3.3-Eclipse-KSN"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # PERBAIKAN: Menambahkan libelf-dev untuk mengatasi error 'libelf.h not found'
          sudo apt-get install -y build-essential bc bison flex libssl-dev git curl \
          python3 python3-pip lld zip unzip libncurses5-dev libelf-dev

      - name: Setup Toolchain (Clang 19)
        run: |
          mkdir -p toolchain/clang
          # Menggunakan Clang r536225
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-2025/clang-r536225.tar.gz"
          echo "Downloading Clang..."
          curl -L "${CLANG_URL}" | tar -xz -C toolchain/clang

      - name: Setup KernelSU-Next (Replace SukiSU)
        run: |
          # Langkah ini menimpa submodule SukiSU dengan KernelSU-Next
          echo "Removing existing KernelSU (SukiSU)..."
          rm -rf drivers/kernelsu
          
          echo "Cloning KernelSU-Next..."
          # Menggunakan branch 'dev' (Development)
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next -b dev drivers/kernelsu
          
          echo "Verifying KernelSU version..."
          head -n 5 drivers/kernelsu/Makefile || echo "Makefile not found!"

      - name: Prepare & Configure Kernel
        run: |
          export PATH="$(pwd)/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          
          echo "Generating GKI defconfig..."
          make O=out gki_defconfig

          # --- Custom Configs ---
          
          # 1. Set Kernel Name
          scripts/config --file out/.config --set-str LOCALVERSION "-${KERNEL_NAME}"
          
          # 2. Configure LTO
          scripts/config --file out/.config -e LTO_CLANG -d LTO_NONE -e LTO_CLANG_THIN -d LTO_CLANG_FULL -e THINLTO

          # 3. Enable KernelSU Configurations (Wajib di-enable ulang karena beda modul)
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e OVERLAY_FS
          
          # Optional: Aktifkan SUSFS jika branch mendukung (Branch 'dev' biasa mungkin belum ada SUSFS)
          # scripts/config --file out/.config -e SUSFS

      - name: Build Kernel Image
        run: |
          export PATH="$(pwd)/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          
          echo "Starting Build..."
          make -j"$(nproc --all)" O=out Image

      - name: Verify Kernel Name
        run: |
          # Memastikan nama version masuk ke dalam Image
          strings out/arch/arm64/boot/Image | grep "Linux version" | head -n 1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-Image
          path: out/arch/arm64/boot/Image
          compression-level: 9
