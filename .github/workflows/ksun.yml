name: Build Aetherium3.3-KSN (GKI 6.1)

on:
  workflow_dispatch:

jobs:
  build:
    # Menggunakan Ubuntu 24.04 (Noble Numbat) untuk memastikan kompatibilitas
    # dengan toolchain dan binary terbaru (seperti pahole/dwarves versi baru).
    runs-on: ubuntu-24.04

    env:
      DEBIAN_FRONTEND: noninteractive
      KERNEL_NAME: "Aetherium3.3-Eclipse-KSN"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # Mengambil source code beserta seluruh submodule secara rekursif
          submodules: recursive
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          echo "Updating package lists..."
          sudo apt-get update
          
          # Instalasi paket esensial untuk kompilasi kernel.
          # Catatan: 
          # - 'dwarves': Menyediakan tool 'pahole' yang dibutuhkan untuk generate BTF.
          # - 'libelf-dev': Wajib ada untuk tool resolve_btfids agar tidak error 'libelf.h not found'.
          sudo apt-get install -y build-essential bc bison flex libssl-dev git curl \
          python3 python3-pip lld zip unzip libncurses5-dev libelf-dev dwarves

      - name: Setup Toolchain (Clang 19)
        run: |
          mkdir -p toolchain/clang
          # Menggunakan prebuilt Clang r536225 dari Google untuk stabilitas build GKI
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-2025/clang-r536225.tar.gz"
          
          echo "Downloading and extracting Clang Toolchain..."
          curl -L "${CLANG_URL}" | tar -xz -C toolchain/clang

      - name: Configure KernelSU-Next (Replace Existing Submodule)
        run: |
          # Membersihkan implementasi KernelSU lama (SukiSU) dari direktori driver
          echo "Cleaning up existing KernelSU directory..."
          rm -rf drivers/kernelsu
          
          # Mengambil source code KernelSU-Next terbaru (Branch: dev)
          echo "Cloning KernelSU-Next (Branch: dev)..."
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next -b dev drivers/kernelsu
          
          # Verifikasi sederhana untuk memastikan cloning berhasil
          if [ -f "drivers/kernelsu/Makefile" ]; then
              echo "KernelSU-Next successfully installed."
          else
              echo "Error: Failed to clone KernelSU-Next." && exit 1
          fi

      - name: Configure Kernel Build Options
        run: |
          # Setup environment variables untuk cross-compilation
          export PATH="$(pwd)/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          
          echo "Generating default GKI configuration..."
          make O=out gki_defconfig

          # --- Modifikasi Konfigurasi (.config) ---
          
          # 1. Identitas Kernel
          # Menambahkan nama custom ke versi kernel agar mudah diidentifikasi
          scripts/config --file out/.config --set-str LOCALVERSION "-${KERNEL_NAME}"
          
          # 2. Optimasi Link Time (LTO)
          # Menggunakan ThinLTO untuk keseimbangan performa runtime dan kecepatan build
          scripts/config --file out/.config -e LTO_CLANG -d LTO_NONE -e LTO_CLANG_THIN -d LTO_CLANG_FULL -e THINLTO

          # 3. Integrasi KernelSU
          # Mengaktifkan KSU dan OverlayFS yang dibutuhkan untuk modul Magisk/KSU
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e OVERLAY_FS

          # 4. Penanganan Error BTF/Pahole (Critical Fix)
          # Menonaktifkan DEBUG_INFO_BTF. Fitur ini sering menyebabkan kegagalan build
          # di environment CI karena ketidakcocokan versi pahole atau vmlinux yang besar.
          # Menonaktifkan ini aman untuk kernel Android standar dan menjamin build sukses.
          scripts/config --file out/.config -d DEBUG_INFO_BTF
          scripts/config --file out/.config -d DEBUG_INFO_BTF_MODULES

      - name: Compile Kernel Image
        run: |
          export PATH="$(pwd)/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          
          echo "Starting compilation with $(nproc --all) threads..."
          make -j"$(nproc --all)" O=out Image

      - name: Verify Compile Output
        run: |
          # Memastikan file Image terbentuk dan mengecek string versinya
          if [ -f out/arch/arm64/boot/Image ]; then
              echo "Build Successful. Checking version string..."
              strings out/arch/arm64/boot/Image | grep "Linux version" | head -n 1
          else
              echo "Build Failed: Image file not found." && exit 1
          fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-Image
          path: out/arch/arm64/boot/Image
          compression-level: 9
